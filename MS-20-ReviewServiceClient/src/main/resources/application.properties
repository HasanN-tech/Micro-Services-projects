spring.application.name=MS-20-ReviewServiceClient

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.boot.admin.client.url=http://localhost:9090/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
server.port=3030


management.endpoints.web.exposure.include=health,info,metrics,env,loggers,circuitbreakers
management.endpoint.health.show-details=always


# ===============================
# Resilience4j Circuit Breaker
# ===============================

# Circuit breaker instance name
resilience4j.circuitbreaker.instances.reviewService.registerHealthIndicator=true

# Number of calls to evaluate
resilience4j.circuitbreaker.instances.reviewService.slidingWindowSize=10

# Use COUNT_BASED or TIME_BASED
resilience4j.circuitbreaker.instances.reviewService.slidingWindowType=COUNT_BASED

# Minimum number of calls before failure rate is calculated
resilience4j.circuitbreaker.instances.reviewService.minimumNumberOfCalls=5

# Open circuit if 50% or more calls fail
resilience4j.circuitbreaker.instances.reviewService.failureRateThreshold=50

# Wait 10 seconds before transitioning from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.reviewService.waitDurationInOpenState=10s

# Number of calls allowed in HALF_OPEN state
resilience4j.circuitbreaker.instances.reviewService.permittedNumberOfCallsInHalfOpenState=3

# Automatically transition from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.reviewService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Record exceptions as failures
resilience4j.circuitbreaker.instances.reviewService.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException

# Ignore specific exceptions
resilience4j.circuitbreaker.instances.reviewService.ignoreExceptions=java.lang.IllegalArgumentException
