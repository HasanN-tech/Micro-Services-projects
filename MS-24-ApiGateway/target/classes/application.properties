spring.application.name=API-Gateway

server.port=1010
eureka.client.service-url.default-zone=http://localhost:8761/

spring.cloud.gateway.server.webmvc.routes[0].id=department-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MS-24-DepartmentService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/department/**


spring.cloud.gateway.server.webmvc.routes[1].id=employee-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://MS-24-EmployeeService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/employee/**
